      // =========================================================================
      // 5. FIGHTER RUNTIME INSTANCE
      // =========================================================================
      class FighterEntity {
        constructor(character, side, x, y, rng) {
          this.char = character;
          this.side = side;
          this.x = x;
          this.y = y;

          const baseAngle = side === 0 ? 0 : Math.PI;
          const angle = baseAngle + (rng() - 0.5) * 0.9;
          this.vx = Math.cos(angle) * character.speed;
          this.vy = Math.sin(angle) * character.speed;

          this.radius = character.radius;
          this.mass = 1;
          this.guardTimer = 0;
          this.maxHp = character.maxHp;
          this.currentHp = character.maxHp;
          this.displayHp = character.maxHp;
          this.trailHp = character.maxHp;

          this.nextCastAt = side === 0 ? .32 : .86;
          this.castIndex = 0;
          this.castIntervalMultiplier = 1;

          this.formStage = 0;
          this.formBefore = null;
          this.isAwakened = false;
          this.skillCast = null;
          this.motion = FighterAnimator.create();
          this.skillReaction = null;
          this.movement = CombatMovement.create();
          this.hitFlash = 0;       // White flash 0.1s khi dính đòn
          this.ultScale = 1.0;

          this.bleedStacks = [];   // [{ dps, remaining, tickAccum, source }] (tối đa 3 stack)
          this.redSlamArmed = false;
          this.redSlamSource = null;
          this.domainSlowTimer = 0;
          this.speedBoostTimer = 0;
          this.damageDebuffTimer = 0;
          this.shrinkTimer = 0;
          this.magicShield = false;
          this.activeSkillCallout = null; // Hiển thị tên skill ngay dưới vạch máu (không che sàn đấu)

          this.totalDamageDealt = 0;
          this.hitsLanded = 0;
          this.trail = [];
          this.custom = {};

          if (character.skills.passive) {
            character.skills.passive(this, null, null, 'init');
          }
        }

        addBleedStack(source, dps, duration, maxStacks = 3) {
          if (this.bleedStacks.length >= maxStacks) {
            // Làm mới stack sắp hết hạn nhất
            this.bleedStacks.sort((a, b) => a.remaining - b.remaining);
            this.bleedStacks[0].remaining = duration;
            this.bleedStacks[0].dps = dps;
            this.bleedStacks[0].source = source;
          } else {
            this.bleedStacks.push({ dps, remaining: duration, tickAccum: 0, source });
          }
        }
      }

      // =========================================================================
      // 6. MAIN BATTLE ARENA ENGINE (2D Physics + Skills + Visual FX)
      // =========================================================================
      class BattleArena {
        constructor() {
          this.p1Id = 'gojo';
          this.p2Id = 'sukuna';
          this.seed = '7772026';
          this.matchDuration = DEFAULT_DURATION;
          this.winnerPreference = 'auto';
          this.running = false;
          this.reset();
        }

        reset() {
          this.rng = createRNG(this.seed);
          this.elapsed = 0;
          this.time = 0;
          this.arenaHalfSize = ARENA_HALF_SIZE;
          this.centerX = ARENA_CX;
          this.centerY = ARENA_CY;
          this.clashAge = 0;
          this.intensity = 0;
          this.collisionCooldown = 0;
          this.hitStop = 0;
          this.finalFormStages = [null, null];
          this.ultimateDomains = [null, null];
          this.transformation = TransformationScene.create();
          this.matchDamage = MatchDamage.create(this.matchDuration);

          // Active skill entities & FX pools
          this.particles = [];
          this.floatingTexts = [];
          this.skillPopups = [];
          this.skillHits = [];
          this.rings = [];
          this.slashes = [];
          this.projectiles = [];
          this.blueVortices = [];
          this.domainEffect = null;

          this.shakeIntensity = 0;
          this.flash = { color: '#ffffff', alpha: 0 };
          this.ultCinematic = { active: false, timer: 0, duration: 0.42, text: '', color: '#ffffff' };
          this.koState = null;

          this.fighters = [
            new FighterEntity(CHARACTER_REGISTRY[this.p1Id], 0, ARENA_CX - 210, ARENA_CY, this.rng),
            new FighterEntity(CHARACTER_REGISTRY[this.p2Id], 1, ARENA_CX + 210, ARENA_CY, this.rng)
          ];

          this.updateTimerDOM();
        }

        // --- Juice & FX Spawners ---
        addShake(amount) {
          this.shakeIntensity = Math.min(36, Math.max(this.shakeIntensity, amount));
        }

        triggerFlash(color = '#ffffff', alpha = 0.65) {
          this.flash.color = color;
          this.flash.alpha = Math.max(this.flash.alpha, Math.min(.36, alpha));
        }

        playCastSound(cast) {
          if (cast.contact) {
            if (['claws', 'sword', 'odm', 'baton', 'hammer'].includes(cast.action)) SoundFX.slash();
          } else if (cast.slot === 'ultimate') SoundFX.redBlast();
        }

        triggerUltimateCinematic(caster, text, color) {
          SoundFX.ultimate();
          caster.ultScale = 1.24;
          this.ultCinematic = { active: true, timer: 0, duration: 0.45, text, color };
        }

        spawnParticles(x, y, color, count = 16, maxSpeed = 400) {
          for (let i = 0; i < count; i++) {
            const ang = Math.random() * Math.PI * 2;
            const spd = 70 + Math.random() * maxSpeed;
            this.particles.push({
              x, y,
              vx: Math.cos(ang) * spd,
              vy: Math.sin(ang) * spd,
              size: 3 + Math.random() * 6,
              color,
              life: 0.35 + Math.random() * 0.45,
              maxLife: 0.8
            });
          }
        }

        spawnRing(x, y, startR, endR, color, duration = 0.4) {
          this.rings.push({ x, y, startR, endR, color, age: 0, duration });
        }

        spawnSlash(x, y, color = '#ff003c', length = 110) {
          this.slashes.push({
            x, y,
            angle: (Math.random() - 0.5) * Math.PI,
            color,
            length,
            age: 0,
            duration: 0.24
          });
        }

        spawnFloatingText(x, y, text, color = '#ffffff', size = 32) {
          this.floatingTexts.push({
            x: x + (Math.random() - 0.5) * 28,
            y,
            vy: -130 - Math.random() * 45,
            text,
            color,
            size,
            age: 0,
            duration: 0.92
          });
        }

        // Hiển thị tên skill ngay dưới vạch máu của nhân vật (không che tầm nhìn sàn đấu)
        showFighterSkill(fighter, text, color = '#ffffff') {
          fighter.activeSkillCallout = { text, color, age: 0, duration: 1.8 };
        }

        // Thông báo toàn sàn (chỉ hiển thị phía trên vòng tròn đấu trường, không che bóng)
        spawnSkillPopup(x, y, text, color = '#ffffff', size = 34) {
          this.skillPopups.push({
            x: Math.max(170, Math.min(CANVAS_W - 170, x)),
            y: Math.min(435, Math.max(365, y)),
            text,
            color,
            size,
            age: 0,
            duration: 1.15
          });
        }

        // --- Main Simulation Update ---
        update(elapsedDt) {
          const rawDt = Math.min(.05, elapsedDt);
          if (this.koState) this.koState.realTimer += elapsedDt;

          const playing = this.running && !this.koState;
          const remaining = this.matchDuration - this.elapsed;
          const endsNow = playing && remaining - elapsedDt < 1e-9;
          const activeDt = playing ? Math.min(rawDt, Math.max(0, remaining)) : 0;
          const stoppedTime = Math.min(this.hitStop, activeDt);
          this.hitStop -= stoppedTime;
          if (playing) {
            this.elapsed = endsNow ? this.matchDuration : this.elapsed + elapsedDt;
            const progress = this.elapsed / this.matchDuration;
            this.intensity = progress * progress;
          }

          this.time += rawDt;
          if (this.skillHits.length && this.time - this.skillHits[0].start >= this.skillHits[0].duration) {
            this.skillHits = this.skillHits.filter(hit => this.time - hit.start < hit.duration);
          }
          const cinematic = playing && !endsNow && TransformationScene.advance(this, Math.min(elapsedDt, remaining));
          const dt = cinematic ? 0 : activeDt - stoppedTime;
          MatchDamage.prune(this);

          this.shakeIntensity = Math.max(0, this.shakeIntensity - rawDt * 52);
          this.flash.alpha = Math.max(0, this.flash.alpha - rawDt * 1.9);

          if (this.ultCinematic.active) {
            this.ultCinematic.timer += rawDt;
            if (this.ultCinematic.timer >= this.ultCinematic.duration) {
              this.ultCinematic.active = false;
            }
          }

          for (const f of this.fighters) {
            f.displayHp += (f.currentHp - f.displayHp) * Math.min(1, rawDt * 14);
            f.trailHp += (f.currentHp - f.trailHp) * Math.min(1, rawDt * 3.8);
            f.hitFlash = Math.max(0, f.hitFlash - rawDt * 10); // ~0.1s white flash
            f.ultScale += (1.0 - f.ultScale) * Math.min(1, rawDt * 5);
            if (f.activeSkillCallout) {
              f.activeSkillCallout.age += rawDt;
              if (f.activeSkillCallout.age >= f.activeSkillCallout.duration) {
                f.activeSkillCallout = null;
              }
            }
          }

          if (dt <= 0) {
            this.updateVisualPools(this.koState ? rawDt : stoppedTime * .35);
            if (playing && !cinematic) MatchDamage.advance(this);
            if (endsNow) this.finishTimedMatch();
            else if (playing) this.updateTimerDOM();
            return;
          }

          if (!this.koState) {
            for (let i = 0; i < 2; i++) {
              const f = this.fighters[i];
              const enemy = this.fighters[1 - i];

              FighterAnimator.advance(f.motion, dt);
              FighterForms.sync(this, f);
              f.domainSlowTimer = Math.max(0, f.domainSlowTimer - dt);
              f.speedBoostTimer = Math.max(0, f.speedBoostTimer - dt);
              f.damageDebuffTimer = Math.max(0, f.damageDebuffTimer - dt);
              f.shrinkTimer = Math.max(0, f.shrinkTimer - dt);
              f.guardTimer = Math.max(0, f.guardTimer - dt);

              SkillTimeline.advanceRotation(this, f, enemy, dt);

              // Passive Update
              if (f.char.skills.passive) {
                f.char.skills.passive(f, enemy, this, 'update', dt);
              }

              // Tia sét/lửa Awakening xung quanh quả bóng
              if (f.isAwakened && Math.random() < 0.32) {
                this.spawnParticles(
                  f.x + (Math.random() - 0.5) * f.radius * 1.7,
                  f.y + (Math.random() - 0.5) * f.radius * 1.7,
                  FighterForms.color(f),
                  1,
                  150
                );
              }

              // Xử lý Bleed Stacks (tối đa 3 stack)
              for (let b = f.bleedStacks.length - 1; b >= 0; b--) {
                const st = f.bleedStacks[b];
                st.remaining -= dt;
                st.tickAccum += dt;
                if (st.tickAccum >= 0.5) {
                  st.tickAccum -= 0.5;
                  const dmg = st.dps * 0.5;
                  this.applyDamage(st.source, f, dmg, {
                    isDot: true,
                    color: '#ff2a55',
                    label: `-${Math.round(dmg)} BLEED`,
                    size: 22
                  });
                  this.spawnParticles(f.x, f.y, '#ff003c', 4, 130);
                }
                if (st.remaining <= 0) f.bleedStacks.splice(b, 1);
              }
            }
          }

          CombatMovement.advance(this, dt);

          // 3. Cập nhật Hố Đen Thương (Gojo Skill 1 - Blue)
          this.updateBlueVortices(dt);

          // 4. Cập nhật Lãnh Địa Phục Ma Ngự Thai Tử (Sukuna Ultimate)
          this.updateDomainEffect(dt);

          // 5. Cập nhật Đạn / Chưởng (Dismantle & Hollow Purple)
          this.updateProjectiles(dt);

          // Integrate movement and collisions in three physics steps.
          this.collisionCooldown = Math.max(0, this.collisionCooldown - dt);
          const subSteps = 3;
          const subDt = dt / subSteps;

          for (let s = 0; s < subSteps; s++) {
            for (let i = 0; i < 2; i++) {
              const f = this.fighters[i];

              const curSpeed = Math.hypot(f.vx, f.vy) || 1;
              const formSpeed = FighterForms.speedMultiplier(f);
              const boostMult = f.speedBoostTimer > 0 ? 1.15 : 1.0;
              const slowMult = f.domainSlowTimer > 0 ? 0.25 : 1.0;
              const targetSpeed = f.char.speed * formSpeed * boostMult * slowMult;
              const blended = curSpeed + (targetSpeed - curSpeed) * Math.min(1, subDt * 6.5);
              f.vx = (f.vx / curSpeed) * blended;
              f.vy = (f.vy / curSpeed) * blended;

              f.x += f.vx * subDt;
              f.y += f.vy * subDt;

              const wallHit = ArenaBounds.reflect(this, f, f.radius);
              if (wallHit) this.handleWallBounce(f, this.fighters[1 - i], wallHit);
            }

            this.resolveBallCollision();
          }

          // Vệt hạt năng lượng phía sau bóng (Particle trail)
          for (const f of this.fighters) {
            f.trail.push({ x: f.x, y: f.y });
            if (f.trail.length > 14) f.trail.shift();
            if (Math.hypot(f.vx, f.vy) > 520 && Math.random() < 0.45) {
              this.spawnParticles(f.x, f.y, f.char.color, 1, 80);
            }
          }

          this.updateVisualPools(dt);
          MatchDamage.advance(this, dt);
          ArenaEffects.advance(this, dt);
          if (endsNow) this.finishTimedMatch();
          else this.updateTimerDOM();
        }

        updateBlueVortices(dt) {
          for (let i = this.blueVortices.length - 1; i >= 0; i--) {
            const v = this.blueVortices[i];
            v.age += dt;
            if (!this.koState) {
              const t = v.target;
              const dx = v.x - t.x;
              const dy = v.y - t.y;
              const d = Math.hypot(dx, dy) || 1;
              // Lực hút cực mạnh kéo đối thủ về phía hố đen Blue
              const pullForce = 1280;
              t.vx += (dx / d) * pullForce * dt;
              t.vy += (dy / d) * pullForce * dt;

              v.tickAccum += dt;
              if (v.tickAccum >= 0.35 && d < 280) {
                v.tickAccum -= 0.35;
                this.applyDamage(v.owner, t, 1.0, {
                  isDot: true,
                  color: '#38b6ff',
                  label: '-1 BLUE',
                  size: 24
                });
              }
            }
            if (v.age >= v.duration) this.blueVortices.splice(i, 1);
          }
        }

        updateDomainEffect(dt) {
          if (!this.domainEffect) return;
          const dom = this.domainEffect;
          dom.age += dt;
          dom.slashAccum += dt;
          dom.dmgAccum += dt;

          // Triệu hồi hàng trăm vết chém đỏ rực phủ kín đấu trường
          if (dom.slashAccum >= 0.03) {
            dom.slashAccum = 0;
            for (let k = 0; k < 3; k++) {
              const span = this.arenaHalfSize - 20;
              this.spawnSlash(
                ARENA_CX + (Math.random() * 2 - 1) * span,
                ARENA_CY + (Math.random() * 2 - 1) * span,
                Math.random() < 0.75 ? '#ff003c' : '#ffffff',
                90 + Math.random() * 140
              );
            }
          }

          if (!this.koState && dom.dmgAccum >= 0.3) {
            dom.dmgAccum -= 0.3;
            SoundFX.slash();
            this.addShake(6);
            this.applyDamage(dom.owner, dom.target, 1.0, {
              isDot: true,
              color: '#ff003c',
              label: '-1 SHRINE',
              size: 25
            });
            this.spawnParticles(dom.target.x, dom.target.y, '#ff003c', 9, 300);
          }

          if (dom.age >= dom.duration) {
            this.domainEffect = null;
          }
        }

        updateProjectiles(dt) {
          const bigUltTypes = [
            'hollow_purple', 'bijuu_dama', 'bajrang_gun',
            'rumbling_wave', 'dora_beam', 'frieren_blackhole',
            'stormbreaker_ult', 'cap_assemble_ult', 'unibeam_ult'
          ];
          for (let i = this.projectiles.length - 1; i >= 0; i--) {
            const p = this.projectiles[i];
            p.x += p.vx * dt;
            p.y += p.vy * dt;
            p.life -= dt;

            const isBigUlt = bigUltTypes.includes(p.type);
            if (isBigUlt && Math.random() < 0.85) {
              this.spawnParticles(p.x, p.y, p.color, 3, 220);
            }

            if (!p.hit && !this.koState && !CombatMovement.avoids(p.target, p.owner, p)) {
              const d = Math.hypot(p.x - p.target.x, p.y - p.target.y);
              if (d < p.radius + p.target.radius) {
                p.hit = true;
                const shown = fmtDmg(p.damage);
                const tag = p.type === 'hollow_purple' ? 'PURPLE!'
                  : p.type === 'bijuu_dama' ? 'BIJUU!'
                  : p.type === 'bajrang_gun' ? 'BAJRANG!'
                  : p.type === 'rumbling_wave' ? 'RUMBLING!'
                  : p.type === 'dora_beam' ? 'BEAM!'
                  : p.type === 'frieren_blackhole' ? 'MAGIC!'
                  : p.type === 'stormbreaker_ult' ? 'STORM!'
                  : p.type === 'cap_assemble_ult' ? 'ASSEMBLE!'
                  : p.type === 'unibeam_ult' ? 'UNIBEAM!'
                  : '';
                const dmgRes = this.applyDamage(p.owner, p.target, p.damage, {
                  isCrit: isBigUlt || p.type === 'thunder_spear',
                  isRanged: true,
                  attack: p,
                  color: p.color,
                  label: tag ? `-${shown} ${tag}` : `-${shown}`,
                  size: isBigUlt ? 44 : 30,
                  cx: p.target.x,
                  cy: p.target.y
                });

                if (dmgRes && !dmgRes.blocked) {
                  if (p.owner.char.skills.passive) {
                    p.owner.char.skills.passive(p.owner, p.target, this, 'onHitSuccess', p);
                  }
                  if (isBigUlt || p.type === 'thunder_spear') {
                    this.addShake(isBigUlt ? 28 : 16);
                    if (isBigUlt) this.triggerFlash(p.color, 0.36);
                    this.spawnRing(p.target.x, p.target.y, 20, isBigUlt ? 290 : 140, p.color, 0.45);
                    this.spawnParticles(p.target.x, p.target.y, p.color, isBigUlt ? 50 : 24, 620);
                  } else if (p.type === 'shadow_clone') {
                    this.spawnParticles(p.x, p.y, '#ffffff', 16, 260);
                  } else if (p.type === 'air_cannon' || p.type === 'mjolnir') {
                    const distPush = Math.hypot(p.vx, p.vy) || 1;
                    p.target.vx += (p.vx / distPush) * 480;
                    p.target.vy += (p.vy / distPush) * 480;
                  }
                }
                if (!isBigUlt) {
                  this.projectiles.splice(i, 1);
                  continue;
                }
              }
            }

            if (p.life <= 0) this.projectiles.splice(i, 1);
          }
        }

        handleWallBounce(fighter, opponent, wallHit) {
          fighter.motion.wall = .19;
          SoundFX.wall(1);
          fighter.char.skills.passive?.(fighter, opponent, this, 'onWallBounce');
          this.spawnParticles(wallHit.x, wallHit.y, fighter.char.color, 8, 240);
          if (!fighter.redSlamArmed) return;
          fighter.redSlamArmed = false;
          this.addShake(18);
          this.spawnParticles(fighter.x, fighter.y, '#ff1e56', 26, 460);
          this.applyDamage(fighter.redSlamSource, fighter, 4.2, {
            isCrit: true, color: '#ff3864', label: '-' + fmtDmg(4.2) + ' WALL SLAM!', size: 34
          });
        }

        resolveBallCollision() {
          const [a, b] = this.fighters;
          const separation = ArenaBounds.separation(this, a, b);
          if (!separation) return;
          const { nx, ny, gap, aSpace, bSpace } = separation;
          const aShare = b.mass / (a.mass + b.mass);
          const aStep = Math.min(aSpace, Math.max(gap * aShare, gap - bSpace));
          const bStep = Math.min(bSpace, gap - aStep);
          a.x -= nx * aStep;
          a.y -= ny * aStep;
          b.x += nx * bStep;
          b.y += ny * bStep;

          const speed = (b.vx - a.vx) * nx + (b.vy - a.vy) * ny;
          if (speed < 475) {
            const impulse = 475 - speed;
            a.vx -= impulse * nx * aShare;
            a.vy -= impulse * ny * aShare;
            b.vx += impulse * nx * (1 - aShare);
            b.vy += impulse * ny * (1 - aShare);
          }
          if (speed >= -30 || this.collisionCooldown > 0 || this.koState) return;

          this.collisionCooldown = .24;
          const cx = (a.x + b.x) / 2;
          const cy = (a.y + b.y) / 2;
          this.processExchange(a, b, cx, cy, nx, ny);
          this.processExchange(b, a, cx, cy, -nx, -ny);
          if (!a.skillCast?.contact) CombatMovement.reset(this, a, b, .23, 560);
          if (!b.skillCast?.contact) CombatMovement.reset(this, b, a, .23, 560);
        }

        processExchange(attacker, defender, cx, cy, nx, ny, useSkill = false) {
          const variance = 0.9 + this.rng() * 0.2;
          const debuffMult = attacker.damageDebuffTimer > 0 ? 0.72 : 1.0;
          let rawDmg = attacker.char.attack * debuffMult * variance;
          const isCrit = this.rng() < attacker.char.critChance;
          if (isCrit) rawDmg *= attacker.char.critMult;

          const hitInfo = {
            damage: Math.max(0.5, rawDmg - defender.char.defense),
            isCrit,
            knockbackBoost: 1.0,
            redSlam: false,
            cx,
            cy
          };

          if (useSkill) attacker.char.skills.skill2(attacker, defender, this, hitInfo);

          const finalDisplayDmg = fmtDmg(hitInfo.damage);
          const dmgRes = this.applyDamage(attacker, defender, hitInfo.damage, {
            isDot: false,
            isCrit: hitInfo.isCrit,
            color: hitInfo.redSlam ? '#ff2a55' : hitInfo.isCrit ? '#ffd60a' : '#ffffff',
            label: hitInfo.isCrit ? `-${finalDisplayDmg} CRIT!` : `-${finalDisplayDmg}`,
            size: hitInfo.isCrit ? 38 : 30,
            cx,
            cy
          });

          if (dmgRes && !dmgRes.blocked) {
            if (attacker.char.skills.passive) {
              attacker.char.skills.passive(attacker, defender, this, 'onHitSuccess', hitInfo);
            }
            if (hitInfo.knockbackBoost > 1.0) {
              defender.vx += nx * 420 * hitInfo.knockbackBoost;
              defender.vy += ny * 420 * hitInfo.knockbackBoost;
            }
            if (hitInfo.redSlam) {
              defender.redSlamArmed = true;
              defender.redSlamSource = attacker;
            }
          }
          return dmgRes;
        }

        applyDamage(attacker, defender, baseAmount, opts) {
          if (this.koState) return { blocked: true, amount: 0 };

          const formDamage = opts.isDot || opts.isReflect ? 1 : FighterForms.damageMultiplier(attacker);
          const matchScale = Math.min(1, DEFAULT_DURATION / this.matchDuration);
          const natural = !opts.isPaced && !opts.isFinisher;
          const scaled = natural ? baseAmount * formDamage * .42 * matchScale : baseAmount;
          const dmgInfo = {
            amount: scaled, isDot: !!opts.isDot, isReflect: !!opts.isReflect,
            isRanged: !!opts.isRanged, blocked: false
          };

          if (natural) {
            if (defender.guardTimer > 0 && !opts.isDot) dmgInfo.amount *= .68;
            defender.char.skills.passive?.(defender, attacker, this, 'onTakeDamage', dmgInfo);
            if (dmgInfo.blocked) return { ...dmgInfo, amount: 0 };
            if (!opts.isDot && !opts.isReflect &&
                (CombatMovement.avoids(defender, attacker, opts.attack) || FighterForms.dodge(this, defender, attacker))) {
              return { ...dmgInfo, blocked: true, amount: 0 };
            }
          }
          dmgInfo.amount = MatchDamage.amount(this, defender, dmgInfo.amount, opts);
          if (dmgInfo.amount <= 0) return { ...dmgInfo, blocked: true };
          defender.currentHp -= dmgInfo.amount;
          if (opts.skill && !opts.isDot && !opts.isReflect) SkillInk.impact(this, attacker, defender, opts.skill, opts);
          if (!opts.isDot) {
            defender.hitFlash = 1.0;
            defender.motion.hit = .18;
          }
          FighterForms.sync(this, defender);

          if (attacker) {
            attacker.totalDamageDealt += dmgInfo.amount;
            if (!opts.isDot) attacker.hitsLanded++;
          }

          const fx = opts.cx ?? defender.x;
          const fy = opts.cy ?? defender.y - defender.radius * 0.5;
          const displayLabel = (opts.label || '-0').replace(/^-\d+(?:\.\d+)?/, `-${fmtDmg(dmgInfo.amount)}`);
          this.spawnFloatingText(fx, fy - 16, displayLabel, opts.color, opts.size);

          if (!opts.isDot) {
            SoundFX.hit(opts.isCrit);
            this.addShake(opts.isFinisher ? 18 : opts.isPaced ? 3 : opts.isCrit ? 14 : 6);
            const count = opts.skill ? (opts.skill.power === 2 ? 8 : 5) : opts.isFinisher ? 28 : opts.isPaced ? 6 : opts.isCrit ? 22 : 12;
            const speed = opts.skill ? 230 : opts.isPaced ? 185 : 420;
            this.spawnParticles(opts.point?.x ?? fx, opts.point?.y ?? fy,
              opts.skill ? opts.color : opts.isCrit ? '#ffd60a' : (attacker?.char.color || opts.color), count, speed);
          }

          return dmgInfo;
        }

        finishTimedMatch() {
          this.elapsed = this.matchDuration;
          this.running = false;
          TransformationScene.clear(this);
          this.floatingTexts.length = 0;
          const { winner, loser } = MatchDamage.resolve(this);
          loser.displayHp = loser.trailHp = loser.currentHp;
          this.koState = { winner, loser, realTimer: 0 };
          for (const fighter of this.fighters) {
            fighter.skillCast = null;
            fighter.activeSkillCallout = null;
          }
          this.ultCinematic.active = false;
          this.skillPopups.length = 0;
          this.projectiles.length = 0;
          this.blueVortices.length = 0;
          SoundFX.ko();
          this.addShake(24);
          this.triggerFlash(FighterForms.color(winner), .31);
          this.spawnRing(loser.x, loser.y, 20, 370, FighterForms.color(winner), .68);
          this.spawnRing(loser.x, loser.y, 10, 235, '#ffffff', .52);
          this.spawnParticles(loser.x, loser.y, FighterForms.color(winner), 48, 570);
          this.updateTimerDOM();
        }

        updateVisualPools(dt) {
          for (let i = this.particles.length - 1; i >= 0; i--) {
            const p = this.particles[i];
            p.x += p.vx * dt;
            p.y += p.vy * dt;
            p.vx *= 0.95;
            p.vy *= 0.95;
            p.life -= dt;
            if (p.life <= 0) this.particles.splice(i, 1);
          }
          for (let i = this.floatingTexts.length - 1; i >= 0; i--) {
            const t = this.floatingTexts[i];
            t.y += t.vy * dt;
            t.vy *= 0.94;
            t.age += dt;
            if (t.age >= t.duration) this.floatingTexts.splice(i, 1);
          }
          for (let i = this.skillPopups.length - 1; i >= 0; i--) {
            const sp = this.skillPopups[i];
            sp.age += dt;
            if (sp.age >= sp.duration) this.skillPopups.splice(i, 1);
          }
          for (let i = this.rings.length - 1; i >= 0; i--) {
            const r = this.rings[i];
            r.age += dt;
            if (r.age >= r.duration) this.rings.splice(i, 1);
          }
          for (let i = this.slashes.length - 1; i >= 0; i--) {
            const s = this.slashes[i];
            s.age += dt;
            if (s.age >= s.duration) this.slashes.splice(i, 1);
          }
        }

        updateTimerDOM() {
          const el = document.getElementById('ui-timer');
          if (!el) return;
          const text = this.timerLabel();
          if (el.textContent !== text) el.textContent = text;
          el.style.color = this.koState ? '#7efabf' : '#00f3ff';
        }

        timerLabel() {
          const seconds = this.koState ? this.matchDuration : Math.floor(this.elapsed * 10) / 10;
          return formatClock(seconds) + ' / ' + formatClock(this.matchDuration);
        }

        // =====================================================================
        // 7. HIGH-FPS CANVAS RENDERING (1080x1920)
        // =====================================================================
        render() {
          ctx.save();
          ctx.fillStyle = '#0a0a10';
          ctx.fillRect(0, 0, CANVAS_W, CANVAS_H);
          ctx.save();
          TransformationScene.applyCamera(ctx, this);

          if (this.shakeIntensity > 0.2) {
            ctx.translate((Math.random() - 0.5) * this.shakeIntensity * 2, (Math.random() - 0.5) * this.shakeIntensity * 2);
          }

          this.drawBackground();
          this.drawArena();

          // Hố đen Thương (Gojo Blue)
          for (const v of this.blueVortices) {
            const pulse = Math.sin(this.time * 18) * 10;
            ctx.save();
            const g = ctx.createRadialGradient(v.x, v.y, 6, v.x, v.y, 92 + pulse);
            g.addColorStop(0, '#000010');
            g.addColorStop(0.35, 'rgba(0, 175, 255, 0.85)');
            g.addColorStop(1, 'rgba(0, 175, 255, 0)');
            ctx.fillStyle = g;
            ctx.beginPath();
            ctx.arc(v.x, v.y, 92 + pulse, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
          }

          // Shockwave Rings
          for (const r of this.rings) {
            const p = r.age / r.duration;
            const radius = r.startR + (r.endR - r.startR) * (1 - Math.pow(1 - p, 3));
            ctx.save();
            ctx.strokeStyle = r.color;
            ctx.globalAlpha = Math.max(0, 1 - p);
            ctx.lineWidth = 8 * (1 - p) + 2;
            ctx.shadowColor = r.color;
            ctx.shadowBlur = 22;
            ctx.beginPath();
            ctx.arc(r.x, r.y, radius, 0, Math.PI * 2);
            ctx.stroke();
            ctx.restore();
          }

          // Màn hình tối dần 0.4s khi tung Ultimate (trước khi vẽ nhân vật để nhân vật nổi bật)
          if (this.ultCinematic.active) {
            const p = this.ultCinematic.timer / this.ultCinematic.duration;
            const dim = p < 0.2 ? (p / 0.2) * .40 : (1 - (p - 0.2) / 0.8) * .40;
            ctx.fillStyle = `rgba(4, 4, 10, ${Math.max(0, dim)})`;
            ctx.fillRect(0, 0, CANVAS_W, CANVAS_H);
          }

          ctx.save();
          ArenaBounds.trace(ctx, this, -6);
          ctx.clip();
          for (const fighter of this.fighters) SkillTimeline.drawBackground(ctx, fighter);
          ctx.restore();
          TransformationScene.drawWorld(ctx, this);

          // Vẽ 2 quả bóng nhân vật đa tầng
          for (const f of this.fighters) {
            if (f.currentHp <= 0 && this.koState && this.koState.realTimer > 0.35) continue;
            CombatMovement.draw(ctx, f);
            this.drawFighter(f);
          }

          ctx.save();
          ArenaBounds.trace(ctx, this, -6);
          ctx.clip();
          MatchDamage.draw(ctx, this);
          for (const fighter of this.fighters) SkillTimeline.draw(ctx, fighter, this);
          ctx.restore();

          this.drawProjectiles();

          // Vết chém (Cleave / Malevolent Shrine)
          for (const s of this.slashes) {
            const p = s.age / s.duration;
            ctx.save();
            ctx.translate(s.x, s.y);
            ctx.rotate(s.angle);
            ctx.strokeStyle = s.color;
            ctx.globalAlpha = 1 - p;
            ctx.lineWidth = 7 * (1 - p) + 2;
            ctx.shadowColor = s.color;
            ctx.shadowBlur = 18;
            ctx.beginPath();
            ctx.moveTo(-s.length / 2, 0);
            ctx.lineTo(s.length / 2, 0);
            ctx.stroke();
            ctx.restore();
          }

          // Hạt tia lửa
          for (const p of this.particles) {
            ctx.save();
            ctx.globalAlpha = Math.max(0, p.life / p.maxLife);
            ctx.fillStyle = p.color;
            ctx.shadowColor = p.color;
            ctx.shadowBlur = 12;
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
          }

          SkillInk.drawImpacts(ctx, this);

          // Số sát thương nhảy
          for (const t of this.floatingTexts) {
            const p = t.age / t.duration;
            const sc = p < 0.15 ? 0.75 + (p / 0.15) * 0.4 : 1.15 - p * 0.15;
            ctx.save();
            ctx.globalAlpha = p > 0.65 ? Math.max(0, 1 - (p - 0.65) / 0.35) : 1;
            ctx.translate(t.x, t.y);
            ctx.scale(sc, sc);
            ctx.font = `900 ${t.size}px 'Segoe UI', Impact, sans-serif`;
            ctx.textAlign = 'center';
            ctx.lineWidth = 6;
            ctx.strokeStyle = '#07070c';
            ctx.strokeText(t.text, 0, 0);
            ctx.fillStyle = t.color;
            ctx.fillText(t.text, 0, 0);
            ctx.restore();
          }

          // Manga-style Skill Popups (Phóng to -> Thu nhỏ nhanh)
          for (const sp of this.skillPopups) {
            const p = sp.age / sp.duration;
            let sc = 1.0;
            if (p < 0.14) sc = 0.4 + (p / 0.14) * 0.95;       // Pop lên 1.35x
            else if (p < 0.28) sc = 1.35 - ((p - 0.14) / 0.14) * 0.35; // Thu nhanh về 1.0x
            const alpha = p > 0.72 ? Math.max(0, 1 - (p - 0.72) / 0.28) : 1;

            ctx.save();
            ctx.globalAlpha = alpha;
            ctx.translate(sp.x, sp.y - p * 26);
            ctx.scale(sc, sc);
            ctx.font = `900 ${sp.size}px 'Segoe UI', Impact, sans-serif`;
            ctx.textAlign = 'center';
            ctx.shadowColor = sp.color;
            ctx.shadowBlur = 18;
            ctx.lineWidth = 8;
            ctx.strokeStyle = '#050508';
            ctx.strokeText(sp.text, 0, 0);
            ctx.fillStyle = sp.color;
            ctx.fillText(sp.text, 0, 0);
            ctx.restore();
          }

          ctx.restore();

          // Tên Ultimate lớn ở phía trên vòng tròn sàn đấu (không che tầm nhìn 2 quả bóng)
          if (this.ultCinematic.active) {
            const p = this.ultCinematic.timer / this.ultCinematic.duration;
            const sc = p < 0.25 ? 1.38 - (p / 0.25) * 0.38 : 1.0;
            ctx.save();
            ctx.translate(ARENA_CX, 448);
            ctx.scale(sc, sc);
            ctx.font = `900 72px 'Segoe UI', Impact, sans-serif`;
            ctx.textAlign = 'center';
            ctx.shadowColor = this.ultCinematic.color;
            ctx.shadowBlur = 36;
            ctx.lineWidth = 11;
            ctx.strokeStyle = '#050508';
            const width = 925 / sc;
            ctx.strokeText(this.ultCinematic.text, 0, 0, width);
            ctx.fillStyle = '#ffffff';
            ctx.fillText(this.ultCinematic.text, 0, 0, width);
            ctx.restore();
          }

          this.drawTopHUD();
          this.drawBottomHUD();
          TransformationScene.drawTitle(ctx, this, CANVAS_W);

          if (this.flash.alpha > 0.01) {
            ctx.save();
            ctx.fillStyle = this.flash.color;
            ctx.globalAlpha = this.flash.alpha;
            ctx.fillRect(0, 0, CANVAS_W, CANVAS_H);
            ctx.restore();
          }

          if (this.koState) {
            this.drawKOOverlay();
          }

          ctx.restore();
        }

        drawBackground() {
          ctx.fillStyle = '#0d0d12';
          ctx.fillRect(0, 0, CANVAS_W, CANVAS_H);

          const bgGrad = ctx.createRadialGradient(ARENA_CX, ARENA_CY, 60, ARENA_CX, ARENA_CY, 700);
          bgGrad.addColorStop(0, this.clashAge > 0 ? 'rgba(99, 81, 191, 0.25)' : 'rgba(0, 200, 255, 0.09)');
          bgGrad.addColorStop(1, 'rgba(13, 13, 18, 0)');
          ctx.fillStyle = bgGrad;
          ctx.fillRect(0, 0, CANVAS_W, CANVAS_H);

          ctx.strokeStyle = 'rgba(255, 255, 255, 0.025)';
          ctx.lineWidth = 1;
          ctx.beginPath();
          for (let x = 0; x <= CANVAS_W; x += 60) { ctx.moveTo(x, 0); ctx.lineTo(x, CANVAS_H); }
          for (let y = 0; y <= CANVAS_H; y += 60) { ctx.moveTo(0, y); ctx.lineTo(CANVAS_W, y); }
          ctx.stroke();
        }

        drawArena() {
          ctx.save();
          ArenaEffects.drawFloor(ctx, this, ARENA_CX, ARENA_CY);

          const ringColor = '#00f3ff';
          ctx.strokeStyle = ringColor;
          ctx.lineWidth = 9;
          ctx.shadowColor = ringColor;
          ctx.shadowBlur = 28 + Math.sin(this.time * 7) * 8;
          ArenaBounds.trace(ctx, this);
          ctx.stroke();

          ctx.shadowBlur = 0;
          ctx.strokeStyle = 'rgba(255, 255, 255, 0.78)';
          ctx.lineWidth = 2.5;
          ArenaBounds.trace(ctx, this);
          ctx.stroke();
          ctx.restore();
          ArenaEffects.drawRim(ctx, this, ringColor);
        }

        drawAvatarAt(character, x, y, r, style) {
          if (character.avatarLoaded && character.avatarImg) {
            ctx.save();
            ctx.beginPath();
            ctx.arc(x, y, r, 0, Math.PI * 2);
            ctx.clip();
            const img = character.avatarImg;
            const scale = Math.max((r * 2) / img.width, (r * 2) / img.height);
            const dw = img.width * scale;
            const dh = img.height * scale;
            ctx.drawImage(img, x - dw / 2, y - dh / 2, dw, dh);
            ctx.restore();
          } else if (!FighterPortraits.draw(ctx, character.id, x, y, r, style)) {
            character.drawFallbackAvatar?.(ctx, x, y, r, style.form >= 3);
          }
        }

        drawFighter(f) {
          const before = f.formBefore;
          const r = before?.radius || f.radius;
          const style = FighterAnimator.pose(f, this.time, this.running, f.currentHp <= 0);
          if (before) {
            style.form = before.stage;
            style.color = before.color;
          }
          TransformationScene.shapePose(this, f, style);
          const rig = UltimateAnimator.pose(this, f, r);
          const shrink = 1 - .28 * Math.min(1, f.shrinkTimer * 4);
          style.sx *= shrink;
          style.sy *= shrink;
          if (this.transformation.active && this.transformation.active.fighter !== f) style.opacity *= .58;
          const accent = style.color;

          FighterAnimator.drawTrail(ctx, f, accent, (x, y) => this.drawAvatarAt(f.char, x, y, r * .9, style));

          const auraSize = r * (1.22 + style.form * .10);
          ctx.save();
          ctx.globalAlpha = style.opacity * (.20 + style.form * .065) * (f.skillCast ? .57 : 1);
          const aura = ctx.createRadialGradient(f.x, f.y, r * .56, f.x, f.y, auraSize);
          aura.addColorStop(0, accent);
          aura.addColorStop(1, 'transparent');
          ctx.fillStyle = aura;
          ctx.beginPath();
          ctx.arc(f.x, f.y, auraSize, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();

          f.char.drawCustomEffects?.(ctx, f, this.time);
          if (f.guardTimer > 0) {
            ctx.save();
            ctx.globalAlpha = Math.min(.64, f.guardTimer);
            ctx.strokeStyle = accent;
            ctx.lineWidth = 4;
            ctx.setLineDash([11, 5]);
            ctx.beginPath();
            ctx.arc(f.x, f.y, r * 1.25, this.time * 2, this.time * 2 + Math.PI * 2);
            ctx.stroke();
            ctx.restore();
          }

          ctx.save();
          ctx.globalAlpha = style.opacity;
          ctx.translate(style.x, style.y);
          ctx.rotate(style.tilt);
          ctx.scale(style.sx, style.sy);
          if (style.form > 0) {
            ctx.strokeStyle = accent;
            ctx.globalAlpha *= f.skillCast ? .24 : .46;
            ctx.lineWidth = 2.2 + style.form * .58;
            const arcStart = this.time * (f.side ? -2.2 : 2.2);
            ctx.beginPath();
            ctx.arc(0, 0, r * 1.13, arcStart, arcStart + Math.PI * .78);
            ctx.stroke();
            ctx.beginPath();
            ctx.arc(0, 0, r * 1.13, arcStart + Math.PI, arcStart + Math.PI * 1.78);
            ctx.stroke();
            ctx.globalAlpha = style.opacity;
          }
          if (rig) UltimateAnimator.drawBack(ctx, rig);
          this.drawAvatarAt(f.char, 0, 0, r * (1.10 + style.form * .016), style);
          if (rig) UltimateAnimator.drawFront(ctx, rig);
          if (f.hitFlash > .15) {
            ctx.globalAlpha = style.opacity * f.hitFlash * .55;
            ctx.strokeStyle = '#fff9f2';
            ctx.lineWidth = 3.5;
            ctx.beginPath();
            ctx.arc(0, 0, r * 1.03, -.9, 1.05);
            ctx.moveTo(-r, r * .13);
            ctx.arc(0, 0, r * 1.03, 3, 4.65);
            ctx.stroke();
          }
          ctx.restore();

          // 5. Viền đỏ đứt đoạn nếu đang bị dính Bleed
          if (f.bleedStacks.length > 0) {
            ctx.save();
            ctx.strokeStyle = '#ff003c';
            ctx.lineWidth = 4;
            ctx.setLineDash([8, 7]);
            ctx.beginPath();
            ctx.arc(f.x, f.y, r + 8, -this.time * 6, -this.time * 6 + Math.PI * 2);
            ctx.stroke();
            ctx.restore();
          }

          // 6. Huy hiệu số máu hình viên thuốc ngay đáy avatar nhân vật (gọn hơn 30% so với ảnh mẫu)
          ctx.save();
          const pillW = r * 1.16;
          const pillH = r * 0.52;
          const pillX = f.x - pillW / 2;
          const pillY = f.y + r * 1.17 - pillH / 2;

          ctx.shadowColor = 'rgba(0, 0, 0, 0.75)';
          ctx.shadowBlur = 10;
          ctx.fillStyle = '#0b0c12';
          this.roundRect(ctx, pillX, pillY, pillW, pillH, pillH / 2);
          ctx.fill();

          ctx.shadowBlur = 0;
          ctx.strokeStyle = accent;
          ctx.lineWidth = 2.6;
          this.roundRect(ctx, pillX, pillY, pillW, pillH, pillH / 2);
          ctx.stroke();

          ctx.font = `800 ${Math.round(pillH * 0.74)}px 'Georgia', 'Segoe UI', serif`;
          ctx.fillStyle = '#ffffff';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText(String(Math.max(0, Math.ceil(f.currentHp))), f.x, pillY + pillH / 2 + 1);
          ctx.restore();
        }

        drawProjectiles() {
          for (const p of this.projectiles) {
            ctx.save();
            if (p.type === 'hollow_purple') {
              const g = ctx.createRadialGradient(p.x, p.y, 12, p.x, p.y, p.radius);
              g.addColorStop(0, '#ffffff');
              g.addColorStop(0.35, '#d147ff');
              g.addColorStop(0.75, '#5a189a');
              g.addColorStop(1, 'rgba(181, 23, 255, 0)');
              ctx.fillStyle = g;
              ctx.shadowColor = '#d147ff';
              ctx.shadowBlur = 40;
              ctx.beginPath();
              ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
              ctx.fill();
            } else if (p.type === 'bijuu_dama') {
              const g = ctx.createRadialGradient(p.x, p.y, 10, p.x, p.y, p.radius);
              g.addColorStop(0, '#1a0600');
              g.addColorStop(0.45, '#7a0b00');
              g.addColorStop(0.78, '#ff5400');
              g.addColorStop(1, 'rgba(255, 145, 0, 0)');
              ctx.fillStyle = g;
              ctx.shadowColor = '#ff5400';
              ctx.shadowBlur = 38;
              ctx.beginPath();
              ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
              ctx.fill();
            } else if (p.type === 'bajrang_gun') {
              const g = ctx.createRadialGradient(p.x, p.y, 16, p.x, p.y, p.radius);
              g.addColorStop(0, '#ffffff');
              g.addColorStop(0.5, '#ffe8b6');
              g.addColorStop(0.8, '#ff3b30');
              g.addColorStop(1, 'rgba(255, 255, 255, 0)');
              ctx.fillStyle = g;
              ctx.shadowColor = '#ffffff';
              ctx.shadowBlur = 42;
              ctx.beginPath();
              ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
              ctx.fill();
            } else if (p.type === 'shadow_clone') {
              ctx.globalAlpha = 0.9;
              this.drawAvatarAt(p.owner.char, p.x, p.y, p.radius, {
                form: p.owner.formStage, pose: 'attack', wind: 0, color: FighterForms.color(p.owner), compact: true
              });
              ctx.strokeStyle = '#ffb703';
              ctx.lineWidth = 4;
              ctx.beginPath();
              ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
              ctx.stroke();
            } else if (
              p.type === 'rumbling_wave' || p.type === 'dora_beam' || p.type === 'frieren_blackhole' ||
              p.type === 'stormbreaker_ult' || p.type === 'cap_assemble_ult' || p.type === 'unibeam_ult'
            ) {
              const g = ctx.createRadialGradient(p.x, p.y, 10, p.x, p.y, p.radius);
              g.addColorStop(0, p.type === 'frieren_blackhole' ? '#070514' : '#ffffff');
              g.addColorStop(0.5, p.color);
              g.addColorStop(1, 'rgba(0,0,0,0)');
              ctx.fillStyle = g;
              ctx.shadowColor = p.color;
              ctx.shadowBlur = 40;
              ctx.beginPath();
              ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
              ctx.fill();
            } else if (p.type === 'vibranium_shield') {
              // Khiên Vibranium đỏ - trắng - xanh xoay cực nhanh
              ctx.fillStyle = '#ef4444';
              ctx.beginPath(); ctx.arc(p.x, p.y, p.radius * 0.85, 0, Math.PI * 2); ctx.fill();
              ctx.fillStyle = '#ffffff';
              ctx.beginPath(); ctx.arc(p.x, p.y, p.radius * 0.62, 0, Math.PI * 2); ctx.fill();
              ctx.fillStyle = '#2563eb';
              ctx.beginPath(); ctx.arc(p.x, p.y, p.radius * 0.38, 0, Math.PI * 2); ctx.fill();
            } else if (p.type === 'mjolnir') {
              ctx.translate(p.x, p.y);
              ctx.rotate(this.time * 18);
              ctx.fillStyle = '#cbd5e1';
              ctx.shadowColor = '#38bdf8';
              ctx.shadowBlur = 18;
              ctx.fillRect(-20, -14, 40, 28);
              ctx.fillStyle = '#92400e';
              ctx.fillRect(-5, 14, 10, 22);
            } else if (p.type === 'repulsor_blast') {
              ctx.translate(p.x, p.y);
              ctx.rotate(p.angle);
              ctx.strokeStyle = '#ffffff';
              ctx.shadowColor = '#38bdf8';
              ctx.shadowBlur = 18;
              ctx.lineWidth = 10;
              ctx.lineCap = 'round';
              ctx.beginPath(); ctx.moveTo(-34, 0); ctx.lineTo(18, 0); ctx.stroke();
            } else if (p.type === 'warhammer_spike' || p.type === 'thunder_spear') {
              ctx.translate(p.x, p.y);
              ctx.rotate(p.angle);
              ctx.fillStyle = p.color;
              ctx.shadowColor = p.color;
              ctx.shadowBlur = 16;
              ctx.beginPath();
              ctx.moveTo(28, 0);
              ctx.lineTo(-22, -9);
              ctx.lineTo(-16, 0);
              ctx.lineTo(-22, 9);
              ctx.closePath();
              ctx.fill();
            } else if (p.type === 'air_cannon') {
              ctx.strokeStyle = '#ffffff';
              ctx.shadowColor = p.color;
              ctx.shadowBlur = 20;
              ctx.lineWidth = 7;
              ctx.beginPath();
              ctx.arc(p.x, p.y, p.radius * 0.72, 0, Math.PI * 2);
              ctx.stroke();
            } else if (p.type === 'dismantle') {
              ctx.translate(p.x, p.y);
              ctx.rotate(p.angle);
              ctx.strokeStyle = '#ffffff';
              ctx.shadowColor = '#ff003c';
              ctx.shadowBlur = 18;
              ctx.lineWidth = 5;
              ctx.beginPath();
              ctx.arc(0, 0, 32, -0.75, 0.75);
              ctx.stroke();
            }
            ctx.restore();
          }
        }

        drawTopHUD() {
          const p1 = this.fighters[0];
          const p2 = this.fighters[1];

          ctx.save();
          ctx.font = `900 44px 'Segoe UI', Impact, sans-serif`;
          ctx.textAlign = 'center';
          ctx.fillStyle = '#ffffff';
          ctx.shadowColor = 'rgba(0, 243, 255, 0.45)';
          ctx.shadowBlur = 16;
          ctx.fillText(`${p1.char.name}  VS  ${p2.char.name}`, ARENA_CX, 112);

          ctx.font = `700 22px 'Segoe UI', sans-serif`;
          ctx.shadowBlur = 0;
          ctx.fillStyle = this.clashAge > 0 ? '#c6afff' : '#9aa3c4';
          ctx.fillText(
            this.clashAge > 0 ? 'ARENA CLASH' : 'LORE ACCURATE ARENA • WHO WINS?',
            ARENA_CX,
            150
          );
          ctx.restore();

          this.drawFighterHUD(p1, 48, 200, 445, true);
          this.drawFighterHUD(p2, CANVAS_W - 48 - 445, 200, 445, false);

          // Huy hiệu VS giữa 2 thanh trạng thái
          ctx.save();
          ctx.fillStyle = '#181a24';
          ctx.strokeStyle = 'rgba(255,255,255,0.25)';
          ctx.lineWidth = 4;
          ctx.beginPath();
          ctx.arc(ARENA_CX, 242, 36, 0, Math.PI * 2);
          ctx.fill();
          ctx.stroke();

          ctx.font = `900 30px 'Segoe UI', Impact, sans-serif`;
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillStyle = '#ffd60a';
          ctx.fillText('VS', ARENA_CX, 244);
          ctx.restore();
        }

        drawFighterHUD(f, x, y, width, isLeft) {
          const barH = 34;
          const avR = 36;
          const barX = isLeft ? x + 52 : x;
          const barW = width - 52;

          ctx.save();
          // Tên nhân vật viết hoa (đã chuyển số máu xuống avatar quả bóng)
          ctx.font = `900 26px 'Segoe UI', sans-serif`;
          ctx.fillStyle = f.char.color;
          ctx.textAlign = isLeft ? 'left' : 'right';
          ctx.fillText(f.char.name, isLeft ? x + 82 : x + width - 82, y - 10);

          // 1. Thanh HP
          ctx.fillStyle = '#1b1d29';
          this.roundRect(ctx, barX, y + 6, barW, barH, 9);
          ctx.fill();

          const trailPct = Math.max(0, f.trailHp / f.maxHp);
          const hpPct = Math.max(0, f.displayHp / f.maxHp);

          ctx.fillStyle = 'rgba(255, 255, 255, 0.5)';
          if (isLeft) this.roundRect(ctx, barX, y + 6, barW * trailPct, barH, 9);
          else this.roundRect(ctx, barX + barW * (1 - trailPct), y + 6, barW * trailPct, barH, 9);
          ctx.fill();

          const hpColor = f.side === 0 ? '#00d9ff' : '#ff1e42';
          ctx.fillStyle = hpColor;
          ctx.shadowColor = hpColor;
          ctx.shadowBlur = 10;
          if (isLeft) this.roundRect(ctx, barX, y + 6, barW * hpPct, barH, 9);
          else this.roundRect(ctx, barX + barW * (1 - hpPct), y + 6, barW * hpPct, barH, 9);
          ctx.fill();
          ctx.shadowBlur = 0;

          ctx.strokeStyle = 'rgba(255,255,255,0.25)';
          ctx.lineWidth = 2;
          this.roundRect(ctx, barX, y + 6, barW, barH, 9);
          ctx.stroke();

          const statusY = y + barH + 14;

          // Form, damage bonus and status indicators
          const badges = [];
          if (f.char.id === 'gojo') {
            if (f.custom.shieldActive) badges.push({ text: '⬡ INFINITY', color: '#00f3ff' });
            else badges.push({ text: `⬡ CD ${Math.ceil(f.custom.shieldCooldown - f.custom.shieldTimer)}s`, color: '#6b7a99' });
          }
          if (f.bleedStacks.length > 0) {
            badges.push({ text: `🩸 BLEED x${f.bleedStacks.length}`, color: '#ff2a55' });
          }
          const damageBonus = Math.round((FighterForms.damageMultiplier(f) - 1) * 100);
          const formLabel = FighterForms.name(f).toUpperCase() + ' · DMG +' + damageBonus + '%';
          badges.unshift({ text: formLabel, color: FighterForms.color(f) });

          ctx.font = '800 17px Segoe UI, sans-serif';
          ctx.textAlign = isLeft ? 'left' : 'right';
          const badgeX = isLeft ? barX + 18 : barX + barW - 18;
          const badgeDirection = isLeft ? 1 : -1;
          let offset = 0;
          for (const badge of badges) {
            const width = ctx.measureText(badge.text).width;
            if (offset + width > barW - 25) break;
            ctx.fillStyle = badge.color;
            ctx.fillText(badge.text, badgeX + offset * badgeDirection, statusY + 20);
            offset += width + 13;
          }

          // 3.5. Hiển thị Tên Skill ngay dưới vạch máu (không che tầm nhìn sàn đấu!)
          if (f.activeSkillCallout) {
            const scObj = f.activeSkillCallout;
            const p = scObj.age / scObj.duration;
            let pop = 1.0;
            if (p < 0.12) pop = 0.65 + (p / 0.12) * 0.5;
            else if (p < 0.24) pop = 1.15 - ((p - 0.12) / 0.12) * 0.15;
            const alpha = p > 0.78 ? Math.max(0, 1 - (p - 0.78) / 0.22) : 1;

            ctx.save();
            ctx.globalAlpha = alpha;
            const sx = isLeft ? barX + 26 : barX + barW - 26;
            const sy = statusY + 61;
            ctx.translate(sx, sy);
            ctx.scale(pop, pop);
            ctx.font = `900 26px 'Segoe UI', Impact, sans-serif`;
            ctx.textAlign = isLeft ? 'left' : 'right';
            ctx.shadowColor = scObj.color;
            ctx.shadowBlur = 16;
            ctx.lineWidth = 6;
            ctx.strokeStyle = '#050508';
            ctx.strokeText(scObj.text, 0, 0);
            ctx.fillStyle = scObj.color;
            ctx.fillText(scObj.text, 0, 0);
            ctx.restore();
          }

          const avX = isLeft ? x + 30 : x + width - 30;
          const avY = y + 29;
          this.drawAvatarAt(f.char, avX, avY, avR * .87, {
            form: f.formStage, pose: 'idle', wind: 0, color: FighterForms.color(f), compact: true
          });

          ctx.restore();
        }

        drawBottomHUD() {
          ctx.save();
          ctx.textAlign = 'center';
          ctx.font = `700 28px 'Segoe UI', sans-serif`;
          ctx.fillStyle = 'rgba(255, 255, 255, 0.56)';
          ctx.fillText('Comment the next battle! Top comment wins 👇', ARENA_CX, 1805);
          ctx.restore();
        }

        // Bảng kết quả cuối trận hoàn toàn bằng TIẾNG ANH
        drawKOOverlay() {
          const { winner, loser, realTimer } = this.koState;
          const fade = Math.min(1, realTimer / 0.45);


          ctx.save();
          ctx.fillStyle = `rgba(5, 6, 11, ${fade * 0.65})`;
          ctx.fillRect(0, 0, CANVAS_W, CANVAS_H);

          const popScale = realTimer < 0.25 ? 1.85 - (realTimer / 0.25) * 0.85 : 1.0;
          ctx.translate(ARENA_CX, 815);
          ctx.scale(popScale, popScale);
          ctx.font = `900 160px 'Segoe UI', Impact, sans-serif`;
          ctx.textAlign = 'center';
          ctx.shadowColor = winner.char.color;
          ctx.shadowBlur = 45;
          ctx.lineWidth = 14;
          ctx.strokeStyle = '#07070c';
          ctx.strokeText('K.O!', 0, 0);
          ctx.fillStyle = '#ffffff';
          ctx.fillText('K.O!', 0, 0);
          ctx.restore();

          {
            const cardFade = Math.min(1, .82 + realTimer * .6);
            ctx.save();
            ctx.globalAlpha = cardFade;

            ctx.font = `900 68px 'Segoe UI', Impact, sans-serif`;
            ctx.textAlign = 'center';
            ctx.shadowColor = winner.char.color;
            ctx.shadowBlur = 30;
            ctx.fillStyle = winner.char.color;
            ctx.fillText(`${winner.char.name} WINS!`, ARENA_CX, 955, 960);
            ctx.shadowBlur = 0;

            const boxW = 680;
            const boxH = 235;
            const boxX = ARENA_CX - boxW / 2;
            const boxY = 1015;

            ctx.fillStyle = 'rgba(16, 18, 28, 0.94)';
            ctx.strokeStyle = winner.char.color;
            ctx.lineWidth = 4;
            this.roundRect(ctx, boxX, boxY, boxW, boxH, 24);
            ctx.fill();
            ctx.stroke();

            ctx.font = `800 34px 'Segoe UI', sans-serif`;
            ctx.fillStyle = '#f2f5ff';
            ctx.fillText(`${winner.side === 0 ? 'LEFT' : 'RIGHT'}  •  ${Math.ceil(winner.currentHp)} / ${winner.maxHp} HP`, ARENA_CX, boxY + 70);
            ctx.fillText(`Match Duration: ${this.elapsed.toFixed(1)}s`, ARENA_CX, boxY + 130);

            ctx.fillStyle = '#9aa4c7';
            ctx.font = `600 26px 'Segoe UI', sans-serif`;
            ctx.fillText(
              `Total Damage: ${Math.round(winner.totalDamageDealt)}  •  Hits Landed: ${winner.hitsLanded}`,
              ARENA_CX,
              boxY + 188
            );

            ctx.restore();
          }
        }

        roundRect(c, x, y, w, h, r) {
          if (w <= 0) { c.beginPath(); return; }
          const radius = Math.min(r, w / 2, h / 2);
          c.beginPath();
          c.moveTo(x + radius, y);
          c.arcTo(x + w, y, x + w, y + h, radius);
          c.arcTo(x + w, y + h, x, y + h, radius);
          c.arcTo(x, y + h, x, y, radius);
          c.arcTo(x, y, x + w, y, radius);
          c.closePath();
        }
      }

      // =========================================================================
      // 8. CREATOR CONTROLS & 60 FPS GAME LOOP
      // =========================================================================
      const game = new BattleArena();

      const panel = document.getElementById('creator-panel');
      const btnStart = document.getElementById('btn-start');
      const btnRestart = document.getElementById('btn-restart');
      const btnRandom = document.getElementById('btn-random');
      const btnSfx = document.getElementById('btn-sfx');
      const inputAvatarP1 = document.getElementById('input-avatar-p1');
      const inputAvatarP2 = document.getElementById('input-avatar-p2');
      const inputSeed = document.getElementById('input-seed');
      const durationInput = document.getElementById('input-duration');
      const winnerSelect = document.getElementById('select-winner');
      const toast = document.getElementById('toast');

      // Searchable Character Picker Component (Hỗ trợ gõ tìm nhanh khi có nhiều nhân vật)
      const allPickers = [];
      function createSearchablePicker(containerId, initialId, onSelect) {
        const root = document.getElementById(containerId);
        let selectedId = initialId;

        root.innerHTML = `
          <button type="button" class="char-picker-btn">
            <span class="char-picker-label"></span>
            <span style="opacity:0.65; font-size:10px;">▼</span>
          </button>
          <div class="char-picker-menu">
            <input type="text" class="char-picker-search" placeholder="🔍 Search character..." autocomplete="off" />
            <div class="char-picker-list"></div>
          </div>
        `;

        const btn = root.querySelector('.char-picker-btn');
        const labelEl = root.querySelector('.char-picker-label');
        const menu = root.querySelector('.char-picker-menu');
        const searchInput = root.querySelector('.char-picker-search');
        const listEl = root.querySelector('.char-picker-list');

        function renderButton() {
          const ch = CHARACTER_REGISTRY[selectedId];
          labelEl.innerHTML = `<span class="char-dot" style="background:${ch.color}; box-shadow:0 0 8px ${ch.color};"></span><span>${ch.name}</span>`;
        }

        function renderList(query = '') {
          const q = query.trim().toLowerCase();
          const keys = Object.keys(CHARACTER_REGISTRY).filter((k) => {
            const ch = CHARACTER_REGISTRY[k];
            return !q || ch.name.toLowerCase().includes(q) || ch.id.toLowerCase().includes(q);
          });

          listEl.innerHTML = '';
          if (keys.length === 0) {
            listEl.innerHTML = `<div class="char-picker-empty">No character found</div>`;
            return;
          }

          for (const k of keys) {
            const ch = CHARACTER_REGISTRY[k];
            const item = document.createElement('div');
            item.className = 'char-picker-item' + (k === selectedId ? ' active' : '');
            item.innerHTML = `<span class="char-dot" style="background:${ch.color};"></span><span>${ch.name}</span>`;
            item.addEventListener('click', () => {
              selectedId = k;
              renderButton();
              closeMenu();
              onSelect(k);
            });
            listEl.appendChild(item);
          }
        }

        function openMenu() {
          allPickers.forEach((p) => p.close());
          menu.classList.add('open');
          searchInput.value = '';
          renderList('');
          setTimeout(() => searchInput.focus(), 10);
        }

        function closeMenu() {
          menu.classList.remove('open');
        }

        btn.addEventListener('click', (e) => {
          e.stopPropagation();
          if (menu.classList.contains('open')) closeMenu();
          else openMenu();
        });

        searchInput.addEventListener('input', () => renderList(searchInput.value));
        searchInput.addEventListener('keydown', (e) => {
          if (e.key === 'Escape') closeMenu();
          if (e.key === 'Enter') {
            const firstItem = listEl.querySelector('.char-picker-item');
            if (firstItem) firstItem.click();
          }
        });
        menu.addEventListener('click', (e) => e.stopPropagation());

        renderButton();
        const api = {
          getValue: () => selectedId,
          setValue: (id) => {
            if (!CHARACTER_REGISTRY[id]) return;
            selectedId = id;
            renderButton();
          },
          close: closeMenu
        };
        allPickers.push(api);
        return api;
      }

      document.addEventListener('click', () => allPickers.forEach((p) => p.close()));

      const pickerP1 = createSearchablePicker('picker-p1', game.p1Id, (id) => {
        inputAvatarP1.value = CHARACTER_REGISTRY[id].avatarUrl || '';
        restartMatch(false);
      });
      const pickerP2 = createSearchablePicker('picker-p2', game.p2Id, (id) => {
        inputAvatarP2.value = CHARACTER_REGISTRY[id].avatarUrl || '';
        restartMatch(false);
      });

      // =========================================================================
      // 9. FULL HD 1080p (1080x1920 @ 60 FPS) VIDEO RECORDER ENGINE
      //    Quay trực tiếp từ Canvas 1080x1920 + Web Audio SFX, không dính UI Panel
      // =========================================================================
      const btnRecordToggle = document.getElementById('btn-record-toggle');
      const btnHideUi = document.getElementById('btn-hide-ui');
      const btnShowUi = document.getElementById('btn-show-ui');

      const MatchRecorder = {
        autoRecord: false,
        recorder: null,
        chunks: [],
        isRecording: false,
        mimeType: 'video/webm',
        ext: 'webm',

        pickMimeType() {
          const candidates = [
            { mime: 'video/mp4;codecs=avc1,mp4a.40.2', ext: 'mp4' },
            { mime: 'video/mp4', ext: 'mp4' },
            { mime: 'video/webm;codecs=vp9,opus', ext: 'webm' },
            { mime: 'video/webm;codecs=vp8,opus', ext: 'webm' },
            { mime: 'video/webm', ext: 'webm' }
          ];
          for (const c of candidates) {
            if (window.MediaRecorder && MediaRecorder.isTypeSupported(c.mime)) {
              return c;
            }
          }
          return { mime: 'video/webm', ext: 'webm' };
        },

        updateButton() {
          if (this.isRecording) {
            btnRecordToggle.textContent = '⏹ REC 1080p...';
            btnRecordToggle.classList.add('rec-on');
          } else {
            btnRecordToggle.classList.remove('rec-on');
            btnRecordToggle.textContent = this.autoRecord ? '🔴 Auto-Rec 1080p: ON' : '🔴 Auto-Rec 1080p: OFF';
          }
        },

        start() {
          if (this.isRecording || !window.MediaRecorder || !canvas.captureStream) return;
          const picked = this.pickMimeType();
          this.mimeType = picked.mime;
          this.ext = picked.ext;
          this.chunks = [];

          // Lấy luồng 1080x1920 60 FPS từ Canvas + luồng âm thanh SFX
          const videoStream = canvas.captureStream(60);
          const tracks = [...videoStream.getVideoTracks(), ...SoundFX.getAudioTracks()];
          const combined = new MediaStream(tracks);

          try {
            this.recorder = new MediaRecorder(combined, {
              mimeType: this.mimeType,
              videoBitsPerSecond: 12000000, // 12 Mbps Full HD 1080p sắc nét
              audioBitsPerSecond: 128000    // 128 kbps audio liên tục không bị rớt tiếng
            });
          } catch (e) {
            this.recorder = new MediaRecorder(combined);
          }

          this.recorder.ondataavailable = (ev) => {
            if (ev.data && ev.data.size > 0) this.chunks.push(ev.data);
          };

          this.recorder.onstop = () => {
            const blob = new Blob(this.chunks, { type: this.mimeType });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            const p1 = game.p1Id;
            const p2 = game.p2Id;
            a.href = url;
            a.download = `battle_${p1}_vs_${p2}_seed${game.seed}_1080p.${this.ext}`;
            document.body.appendChild(a);
            a.click();
            a.remove();
            setTimeout(() => URL.revokeObjectURL(url), 5000);
            this.isRecording = false;
            this.updateButton();
            showToast(`✅ Đã lưu video 1080p (.${this.ext})!`);
          };

          this.recorder.start(250);
          this.isRecording = true;
          this.updateButton();
          showToast('🔴 Đang quay Full HD 1080p 60fps — Tự động lưu khi hiện kết quả!');
        },

        stop() {
          if (this.recorder && this.isRecording && this.recorder.state !== 'inactive') {
            this.recorder.stop();
          }
        },

        checkAutoStop() {
          // Tự động dừng và xuất video sau khi hiện bảng kết quả K.O được ~2.2 giây
          if (this.isRecording && game.koState && game.koState.realTimer >= 3.2) {
            this.stop();
          }
        }
      };

      const compactViewport = window.matchMedia('(max-width: 760px)');

      function toggleUI() {
        const hidden = panel.classList.toggle('hidden');
        btnShowUi.classList.toggle('visible', hidden);
        if (hidden) showToast('Creator Panel hidden — Click Show UI or press H');
      }

      btnHideUi.addEventListener('click', toggleUI);
      btnShowUi.addEventListener('click', toggleUI);

      btnRecordToggle.addEventListener('click', () => {
        if (MatchRecorder.isRecording) {
          MatchRecorder.stop();
          return;
        }
        MatchRecorder.autoRecord = !MatchRecorder.autoRecord;
        MatchRecorder.updateButton();
        if (MatchRecorder.autoRecord) {
          showToast('🔴 Auto-Rec 1080p ON — Bấm Start để bắt đầu quay!');
        }
      });

      function syncStartBtn() {
        btnStart.textContent = game.koState ? '▶ Replay' : game.running ? '⏸ Pause' : '▶ Start';
        durationInput.disabled = game.running || (!game.koState && game.elapsed > 0);
      }

      function toggleRun() {
        if (game.koState || (!game.running && game.elapsed === 0)) {
          restartMatch(true);
          return;
        }
        game.running = !game.running;
        lastTs = performance.now();
        syncStartBtn();
      }

      function restartMatch(autoStart = true) {
        const duration = durationInput.valueAsNumber;
        if (autoStart && (!durationInput.reportValidity() || !Number.isFinite(duration))) return;
        if (Number.isFinite(duration) && durationInput.validity.valid) game.matchDuration = duration;
        game.winnerPreference = winnerSelect.value;
        SoundFX.ensure();
        if (MatchRecorder.isRecording) MatchRecorder.stop();
        game.seed = inputSeed.value.trim() || '7772026';
        game.p1Id = pickerP1.getValue();
        game.p2Id = pickerP2.getValue();
        game.reset();
        game.running = autoStart;
        if (autoStart) lastTs = performance.now();
        if (autoStart && compactViewport.matches && !panel.classList.contains('hidden')) toggleUI();
        if (autoStart && MatchRecorder.autoRecord) MatchRecorder.start();
        syncStartBtn();
      }

      btnStart.addEventListener('click', toggleRun);
      btnRestart.addEventListener('click', () => restartMatch(true));

      document.getElementById('btn-random-match').addEventListener('click', () => {
        const keys = Object.keys(CHARACTER_REGISTRY);
        const i1 = Math.floor(Math.random() * keys.length);
        let i2 = Math.floor(Math.random() * keys.length);
        if (keys.length > 1) {
          while (i2 === i1) i2 = Math.floor(Math.random() * keys.length);
        }
        pickerP1.setValue(keys[i1]);
        pickerP2.setValue(keys[i2]);
        inputAvatarP1.value = CHARACTER_REGISTRY[keys[i1]].avatarUrl || '';
        inputAvatarP2.value = CHARACTER_REGISTRY[keys[i2]].avatarUrl || '';
        inputSeed.value = String(Math.floor(100000 + Math.random() * 900000));
        restartMatch(true);
      });

      btnRandom.addEventListener('click', () => {
        inputSeed.value = String(Math.floor(100000 + Math.random() * 900000));
        restartMatch(true);
      });

      btnSfx.addEventListener('click', () => {
        SoundFX.enabled = !SoundFX.enabled;
        btnSfx.textContent = SoundFX.enabled ? '🔊 SFX: ON' : '🔇 SFX: OFF';
      });

      inputAvatarP1.addEventListener('change', () => {
        CHARACTER_REGISTRY[pickerP1.getValue()].setAvatarUrl(inputAvatarP1.value);
      });
      inputAvatarP2.addEventListener('change', () => {
        CHARACTER_REGISTRY[pickerP2.getValue()].setAvatarUrl(inputAvatarP2.value);
      });

      inputSeed.addEventListener('change', () => restartMatch(false));

      winnerSelect.addEventListener('change', () => { game.winnerPreference = winnerSelect.value; });

      durationInput.addEventListener('change', () => {
        if (!game.running && game.elapsed === 0 && durationInput.validity.valid) restartMatch(false);
      });

      let toastTimer = null;
      function showToast(msg) {
        toast.textContent = msg;
        toast.classList.add('show');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => toast.classList.remove('show'), 2200);
      }

      window.addEventListener('keydown', (e) => {
        if (['INPUT', 'SELECT'].includes(document.activeElement.tagName)) return;
        const k = e.key.toLowerCase();
        if (k === 'h') {
          toggleUI();
        } else if (e.code === 'Space') {
          e.preventDefault();
          toggleRun();
        } else if (k === 'r') {
          restartMatch(true);
        }
      });

      let lastTs = performance.now();
      function loop(now) {
        const rawDt = Math.max(0, (now - lastTs) / 1000);
        lastTs = now;
        const wasRunning = game.running;
        game.update(rawDt);
        if (wasRunning !== game.running) syncStartBtn();
        game.render();
        MatchRecorder.checkAutoStop();
        requestAnimationFrame(loop);
      }

      requestAnimationFrame(loop);
    })();
  </script>
</body>
