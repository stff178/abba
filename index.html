<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Anime Ball Battle Simulator — 9:16 TikTok/Shorts Engine</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      background: #050508;
      color: #f4f6fb;
      font-family: 'Segoe UI', system-ui, -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Responsive 9:16 Stage Container (1080x1920 logical) */
    #stage-wrapper {
      position: relative;
      height: 100vh;
      width: calc(100vh * 9 / 16);
      max-width: 100vw;
      max-height: calc(100vw * 16 / 9);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 70px rgba(0, 0, 0, 0.95);
      background: #0d0d12;
      overflow: hidden;
    }

    canvas#arena-canvas {
      width: 100%;
      height: 100%;
      display: block;
      background: #0d0d12;
    }

    /* Creator Control Panel (Press 'H' to hide/show) */
    #creator-panel {
      position: fixed;
      top: 14px;
      right: 14px;
      width: 292px;
      max-height: calc(100vh - 28px);
      overflow-y: auto;
      background: rgba(14, 15, 23, 0.94);
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 14px;
      padding: 14px;
      backdrop-filter: blur(12px);
      box-shadow: 0 12px 35px rgba(0, 0, 0, 0.7);
      z-index: 100;
      transition: opacity 0.22s ease, transform 0.22s ease;
      font-size: 12px;
    }

    #creator-panel.hidden {
      opacity: 0;
      pointer-events: none;
      transform: translateX(24px);
    }

    @media (max-width: 760px) {
      #creator-panel {
        top: auto;
        right: 8px;
        bottom: 8px;
        left: 8px;
        width: auto;
        max-height: min(39dvh, 320px);
      }
    }

    /* Floating Show UI Button (appears right where the panel hides) */
    #btn-show-ui {
      position: fixed;
      top: 14px;
      right: 14px;
      z-index: 105;
      padding: 8px 13px;
      border-radius: 10px;
      border: 1px solid rgba(0, 243, 255, 0.45);
      background: rgba(14, 15, 23, 0.88);
      color: #00f3ff;
      font-weight: 800;
      font-size: 12px;
      backdrop-filter: blur(10px);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.65);
      cursor: pointer;
      opacity: 0;
      pointer-events: none;
      transform: translateX(12px);
      transition: opacity 0.2s ease, transform 0.2s ease;
    }

    @media (max-width: 760px) {
      #btn-show-ui {
        top: auto;
        right: 8px;
        bottom: 8px;
      }
    }

    #btn-show-ui.visible {
      opacity: 1;
      pointer-events: auto;
      transform: translateX(0);
    }

    .panel-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
      padding-bottom: 8px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    .panel-title {
      font-weight: 800;
      font-size: 13px;
      letter-spacing: 0.6px;
      text-transform: uppercase;
      color: #00f3ff;
    }

    .hotkey-badge {
      font-size: 11px;
      background: rgba(255, 255, 255, 0.1);
      padding: 2px 7px;
      border-radius: 6px;
      color: #c5cbe3;
    }

    .timer-box {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid rgba(255, 255, 255, 0.08);
      padding: 8px 10px;
      border-radius: 8px;
      margin-bottom: 10px;
    }

    .timer-value {
      font-family: 'Consolas', 'Courier New', monospace;
      font-size: 16px;
      font-weight: 800;
      color: #00f3ff;
    }

    .control-row {
      display: flex;
      gap: 6px;
      margin-bottom: 9px;
    }

    .control-group {
      margin-bottom: 9px;
    }

    .control-group label {
      display: flex;
      justify-content: space-between;
      font-size: 10.5px;
      font-weight: 700;
      color: #9da6c2;
      margin-bottom: 4px;
      text-transform: uppercase;
      letter-spacing: 0.4px;
    }

    button {
      flex: 1;
      padding: 8px 10px;
      border: none;
      border-radius: 8px;
      font-weight: 700;
      font-size: 12px;
      cursor: pointer;
      transition: transform 0.1s ease, filter 0.15s ease;
      color: #fff;
      background: #25283a;
    }

    button:hover { filter: brightness(1.18); }
    button:active { transform: scale(0.96); }
    button.primary { background: linear-gradient(135deg, #00c3ff, #0066ff); }
    button.danger { background: linear-gradient(135deg, #ff003c, #b5002b); }
    button.accent { background: linear-gradient(135deg, #9d4edd, #5a189a); }
    button.rec-on {
      background: linear-gradient(135deg, #ff003c, #c8002f);
      box-shadow: 0 0 14px rgba(255, 0, 60, 0.55);
      animation: recPulse 1.2s infinite;
    }

    @keyframes recPulse {
      0%, 100% { filter: brightness(1); }
      50% { filter: brightness(1.28); }
    }

    input[type="text"], input[type="number"], select {
      width: 100%;
      padding: 6px 8px;
      border-radius: 7px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      background: #171925;
      color: #fff;
      font-size: 12px;
      outline: none;
    }

    input[type="text"]:focus, input[type="number"]:focus, select:focus {
      border-color: #00f3ff;
    }

    /* Searchable Character Picker */
    .char-picker {
      position: relative;
    }

    .char-picker-btn {
      width: 100%;
      padding: 7px 10px;
      border-radius: 7px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      background: #171925;
      color: #fff;
      font-size: 12px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
    }

    .char-picker-btn:hover {
      border-color: #00f3ff;
      filter: none;
    }

    .char-picker-label {
      display: flex;
      align-items: center;
      gap: 7px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .char-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .char-picker-menu {
      position: absolute;
      top: calc(100% + 4px);
      left: 0;
      right: 0;
      background: #131520;
      border: 1px solid rgba(0, 243, 255, 0.4);
      border-radius: 9px;
      padding: 6px;
      box-shadow: 0 12px 28px rgba(0, 0, 0, 0.85);
      z-index: 250;
      display: none;
    }

    .char-picker-menu.open {
      display: block;
    }

    .char-picker-search {
      margin-bottom: 6px;
      font-size: 12px !important;
      padding: 6px 8px !important;
    }

    .char-picker-list {
      max-height: 175px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .char-picker-item {
      padding: 6px 8px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      color: #e4e9ff;
      background: transparent;
      text-align: left;
    }

    .char-picker-item:hover,
    .char-picker-item.active {
      background: rgba(0, 243, 255, 0.16);
      color: #ffffff;
    }

    .char-picker-empty {
      padding: 8px;
      text-align: center;
      font-size: 11px;
      color: #7c85a6;
    }

    .match-settings {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1.2fr);
      gap: 8px;
    }

    .panel-footer {
      font-size: 11px;
      color: #7c85a6;
      line-height: 1.45;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      padding-top: 8px;
    }

    #toast {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(15, 16, 24, 0.9);
      border: 1px solid rgba(255, 255, 255, 0.18);
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 12px;
      color: #dbe2ff;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
      z-index: 200;
    }

    #toast.show { opacity: 1; }
  </style>
</head>
<body>
  <div id="stage-wrapper">
    <canvas id="arena-canvas" width="1080" height="1920"></canvas>
  </div>

  <!-- Creator Control Panel -->
  <aside id="creator-panel">
    <div class="panel-header">
      <span class="panel-title">Creator Studio</span>
      <span class="hotkey-badge">H: Hide UI</span>
    </div>

    <div class="timer-box">
      <div>
        <div style="font-size:10px; color:#9da6c2; text-transform:uppercase;">Match Timer</div>
        <div style="font-size:10px; color:#7f89ab;">Elapsed / Limit</div>
      </div>
      <div id="ui-timer" class="timer-value">00:00.0 / 01:00.0</div>
    </div>

    <div class="match-settings">
      <div class="control-group">
        <label for="input-duration">Thời lượng (giây)</label>
        <input id="input-duration" type="number" value="60" min="1" step="0.1" required />
      </div>
      <div class="control-group">
        <label for="select-winner">Bên thắng</label>
        <select id="select-winner">
          <option value="auto">Tự động theo HP</option>
          <option value="0">Bên trái</option>
          <option value="1">Bên phải</option>
        </select>
      </div>
    </div>

    <div class="control-row">
      <button id="btn-start" class="primary">▶ Start</button>
      <button id="btn-restart" class="danger">↺ Restart</button>
    </div>

    <div class="control-row">
      <button id="btn-record-toggle">🔴 Auto-Rec 1080p: OFF</button>
      <button id="btn-hide-ui">👁 Hide UI</button>
    </div>

    <div class="control-row">
      <button id="btn-random-match" class="accent">⚔️ Random Match</button>
    </div>

    <div class="control-row">
      <button id="btn-random">🎲 New Seed</button>
      <button id="btn-sfx">🔊 SFX: ON</button>
    </div>

    <div class="control-group">
      <label>Fighter 1 (Left)</label>
      <div id="picker-p1" class="char-picker"></div>
    </div>

    <div class="control-group">
      <label for="input-avatar-p1">P1 Avatar URL (PNG/WebP)</label>
      <input id="input-avatar-p1" type="text" placeholder="Optional: https://... (blank = Canvas art)" />
    </div>

    <div class="control-group">
      <label>Fighter 2 (Right)</label>
      <div id="picker-p2" class="char-picker"></div>
    </div>

    <div class="control-group">
      <label for="input-avatar-p2">P2 Avatar URL (PNG/WebP)</label>
      <input id="input-avatar-p2" type="text" placeholder="Optional: https://... (blank = Canvas art)" />
    </div>

    <div class="control-group">
      <label for="input-seed"><span>Random Seed</span></label>
      <input id="input-seed" type="text" value="7772026" placeholder="Enter seed..." />
    </div>

    <div class="panel-footer">
      <b>Hotkeys:</b> <code>H</code> Hide/Show UI • <code>Space</code> Play/Pause • <code>R</code> Restart
    </div>
  </aside>

  <button id="btn-show-ui" type="button">👁 Show UI</button>

  <div id="toast">Creator Panel hidden — Press H to show</div>

  <script src="src/characters/fighter-roster.js"></script>
  <script src="src/characters/marvel-portraits.js"></script>
  <script src="src/characters/final-portraits.js"></script>
  <script src="src/characters/form-portraits.js"></script>
  <script src="src/characters/portraits.js"></script>
  <script src="src/arena/arena-bounds.js"></script>
  <script src="src/arena/arena-effects.js"></script>
  <script src="src/combat/transformations.js"></script>
  <script src="src/animation/fighter-animator.js"></script>
  <script src="src/animation/transformation-scene.js"></script>
  <script src="src/combat/combat-movement.js"></script>
  <script src="src/combat/match-damage.js"></script>
  <script src="src/skills/ultimate-moves.js"></script>
  <script src="src/skills/skill-ink.js"></script>
  <script src="src/animation/ultimate-animator.js"></script>
  <script src="src/skills/contact-skills.js"></script>
  <script src="src/skills/arena-ultimates.js"></script>
  <script src="src/skills/comic-skills.js"></script>
  <script src="src/skills/signature-skills.js"></script>
  <script src="src/skills/skill-timeline.js"></script>
  <script>
    (() => {
      'use strict';

      // =========================================================================
      // 1. CONSTANTS & CANVAS CONFIGURATION (9:16 Vertical 1080x1920)
      // =========================================================================
      const CANVAS_W = 1080;
      const CANVAS_H = 1920;
      const ARENA_CX = CANVAS_W / 2;
      const ARENA_CY = 1095;
      const ARENA_HALF_SIZE = 450;
      const DEFAULT_DURATION = 60;

      function formatClock(seconds) {
        const total = Math.round(seconds * 10);
        const mins = Math.floor(total / 600);
        const secs = ((total % 600) / 10).toFixed(1).padStart(4, '0');
        return String(mins).padStart(2, '0') + ':' + secs;
      }

      const canvas = document.getElementById('arena-canvas');
      const ctx = canvas.getContext('2d');

      // Format damage neatly for 100 Max HP scale (e.g. 1.6, 4.2, 10)
      function fmtDmg(v) {
        if (v >= 10) return String(Math.round(v));
        return String(Math.max(0.1, Number(v.toFixed(1))));
      }

      // =========================================================================
      // 2. DETERMINISTIC PRNG (Mulberry32)
      // =========================================================================
      function hashSeed(str) {
        let h = 2166136261 >>> 0;
        const s = String(str);
        for (let i = 0; i < s.length; i++) {
          h ^= s.charCodeAt(i);
          h = Math.imul(h, 16777619);
        }
        return h >>> 0;
      }

      function createRNG(seedStr) {
        let a = hashSeed(seedStr);
        return function () {
          a |= 0;
          a = (a + 0x6D2B79F5) | 0;
          let t = Math.imul(a ^ (a >>> 15), 1 | a);
          t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
          return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        };
      }

      // =========================================================================
      // 3. PROCEDURAL WEB AUDIO SFX ENGINE (Zero external audio files needed)
      // =========================================================================
      const SoundFX = {
        enabled: true,
        ctx: null,
        dest: null,
        masterBus: null,
        keepAliveOsc: null,

        ensure() {
          if (!this.ctx) {
            const AudioCtx = window.AudioContext || window.webkitAudioContext;
            if (AudioCtx) {
              this.ctx = new AudioCtx();
              this.dest = this.ctx.createMediaStreamDestination();
              this.masterBus = this.ctx.createGain();
              this.masterBus.gain.value = 1.0;
              this.masterBus.connect(this.ctx.destination);
              this.masterBus.connect(this.dest);

              // Luồng âm thanh giữ nhịp siêu nhỏ (không nghe thấy) để Chrome MediaRecorder
              // không bao giờ bị ngắt hoặc lệch timestamp audio giữa các khoảng lặng SFX!
              const osc = this.ctx.createOscillator();
              const silentGain = this.ctx.createGain();
              osc.frequency.value = 20;
              silentGain.gain.value = 0.00005;
              osc.connect(silentGain);
              silentGain.connect(this.dest);
              osc.start();
              this.keepAliveOsc = osc;
            }
          }
          if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
          return this.enabled ? this.ctx : null;
        },

        getAudioTracks() {
          this.ensure();
          return this.dest ? this.dest.stream.getAudioTracks() : [];
        },

        tone({ freq = 220, endFreq = 70, dur = 0.12, type = 'triangle', gain = 0.16 }) {
          const ac = this.ensure();
          if (!ac || !this.masterBus) return;
          const now = ac.currentTime;
          const osc = ac.createOscillator();
          const g = ac.createGain();
          osc.type = type;
          osc.frequency.setValueAtTime(freq, now);
          osc.frequency.exponentialRampToValueAtTime(Math.max(20, endFreq), now + dur);
          g.gain.setValueAtTime(gain, now);
          g.gain.exponentialRampToValueAtTime(0.001, now + dur);
          osc.connect(g);
          g.connect(this.masterBus);
          osc.start(now);
          osc.stop(now + dur);
        },

        wall(spd = 1) { this.tone({ freq: 140 + spd * 80, endFreq: 60, dur: 0.08, type: 'sine', gain: 0.1 }); },
        hit(crit = false) { this.tone({ freq: crit ? 430 : 240, endFreq: 65, dur: crit ? 0.17 : 0.11, type: crit ? 'sawtooth' : 'triangle', gain: crit ? 0.21 : 0.15 }); },
        block() { this.tone({ freq: 920, endFreq: 1440, dur: 0.16, type: 'sine', gain: 0.16 }); },
        bluePull() { this.tone({ freq: 320, endFreq: 110, dur: 0.32, type: 'sine', gain: 0.15 }); },
        redBlast() { this.tone({ freq: 520, endFreq: 55, dur: 0.3, type: 'sawtooth', gain: 0.24 }); },
        slash() { this.tone({ freq: 980, endFreq: 210, dur: 0.1, type: 'sawtooth', gain: 0.14 }); },
        ultimate() {
          this.tone({ freq: 140, endFreq: 34, dur: 0.55, type: 'sawtooth', gain: 0.28 });
          this.tone({ freq: 520, endFreq: 180, dur: 0.45, type: 'triangle', gain: 0.16 });
        },
        ko() {
          this.tone({ freq: 150, endFreq: 24, dur: 0.85, type: 'sawtooth', gain: 0.32 });
          this.tone({ freq: 360, endFreq: 42, dur: 0.6, type: 'square', gain: 0.14 });
        }
      };

      // =========================================================================
      // 4. CHARACTER CLASS & MODULAR CHARACTER DEFINITIONS
      //    Mỗi nhân vật có: 1 Nội tại (passive) + 3 Chiêu thức (skill1, skill2, ultimate)
      // =========================================================================
      class Character {
        constructor(config) {
          this.id = config.id;
          this.name = config.name;
          this.avatarUrl = config.avatarUrl || '';
          this.color = config.color;
          this.secondaryColor = config.secondaryColor || config.color;
          this.maxHp = config.maxHp || 1500;
          this.attack = config.attack || 52;
          this.defense = config.defense || 10;
          this.speed = config.speed || 455;
          this.critChance = config.critChance || 0.18;
          this.critMult = config.critMult || 1.5;
          this.radius = config.radius || 62;
          this.skills = config.skills || {};
          this.drawFallbackAvatar = config.drawFallbackAvatar;
          this.drawCustomEffects = config.drawCustomEffects;

          // Cache ảnh URL nếu người dùng cung cấp avatarUrl
          this.avatarImg = null;
          this.avatarLoaded = false;
          if (this.avatarUrl) this.setAvatarUrl(this.avatarUrl);
        }

        setAvatarUrl(url) {
          this.avatarUrl = (url || '').trim();
          this.avatarImg = null;
          this.avatarLoaded = false;
          if (!this.avatarUrl) return;

          const img = new Image();
          img.crossOrigin = 'anonymous';
          img.onload = () => {
            this.avatarImg = img;
            this.avatarLoaded = true;
          };
          img.onerror = () => {
            this.avatarImg = null;
            this.avatarLoaded = false;
          };
          img.src = this.avatarUrl;
        }
      }

      // --- Character 1: GOJO SATORU ---
      const GOJO_CONFIG = {
        id: 'gojo',
        name: 'GOJO SATORU',
        avatarUrl: '',
        color: '#00f3ff',
        secondaryColor: '#b517ff',
        maxHp: 100,
        attack: 2.0,
        defense: 0.55,
        speed: 390,
        critChance: 0.16,
        critMult: 1.5,
        radius: 62,
        skills: {
          // NỘI TẠI: Vô Hạ Hạn (Limitless Barrier) — Chặn 100% 1 đòn đánh, hồi lại sau 9 giây
          passive(self, target, arena, eventType, payload) {
            if (eventType === 'init') {
              self.custom.shieldActive = true;
              self.custom.shieldTimer = 0;
              self.custom.shieldCooldown = 9.0;
            } else if (eventType === 'update') {
              const dt = payload;
              if (!self.custom.shieldActive) {
                self.custom.shieldTimer += dt;
                if (self.custom.shieldTimer >= self.custom.shieldCooldown) {
                  self.custom.shieldActive = true;
                  self.custom.shieldTimer = 0;
                  arena.spawnRing(self.x, self.y, self.radius + 10, self.radius + 55, '#00f3ff', 0.35);
                  arena.showFighterSkill(self, '[LIMITLESS READY!]', '#00f3ff');
                }
              }
            } else if (eventType === 'onTakeDamage') {
              const dmgInfo = payload;
              if (self.custom.shieldActive && !dmgInfo.isDot) {
                self.custom.shieldActive = false;
                self.custom.shieldTimer = 0;
                dmgInfo.amount = 0;
                dmgInfo.blocked = true;
                SoundFX.block();
                arena.spawnRing(self.x, self.y, self.radius + 12, self.radius + 90, '#00f3ff', 0.42);
                arena.spawnParticles(self.x, self.y, '#00f3ff', 24, 380);
                arena.showFighterSkill(self, '[INFINITY BLOCKED!]', '#00f3ff');
              }
            }
          },

          // CHIÊU 1: Thuật thức Thuận Chuyển: Thương (Lapse: Blue) — Tạo hố đen hút 1.5s & gây sát thương kéo
          skill1(self, target, arena) {
            SoundFX.bluePull();
            arena.blueVortices.push({
              owner: self,
              target,
              x: self.x,
              y: self.y,
              age: 0,
              duration: 1.5,
              tickAccum: 0
            });
            arena.spawnRing(self.x, self.y, 14, 130, '#0099ff', 0.45);
            arena.showFighterSkill(self, '[LAPSE: BLUE!]', '#38b6ff');
          },

          // CHIÊU 2: Thuật thức Nghịch Chuyển: Hách (Reversal: Red) — Sóng xung kích đỏ hất văng đập tường
          skill2(self, target, arena, hitInfo) {
            SoundFX.redBlast();
            hitInfo.damage *= 1.38;
